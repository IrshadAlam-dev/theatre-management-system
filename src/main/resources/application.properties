spring.application.name=theatre-management-system

# MySQL connection. Values are supplied by environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/theatre_management}
spring.datasource.username=${DB_USERNAME:theatre_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns all database schema changes.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate checks that the entities match the schema but never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:${SERVER_PORT:8080}}

# Only the safe health endpoint is exposed by default.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# A different, random 32-byte signing key must be supplied for every environment.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=theatre-management-system
app.jwt.expires-in-seconds=3600
